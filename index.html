    margin: 0;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, #f3ecdd 100%);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .header {
    background: linear-gradient(120deg, var(--teal), var(--ink2));
    color: white;
    padding: 1rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .header-back {
    background: rgba(255,255,255,0.14);
    border: none;
    color: white;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-back:active { background: rgba(255,255,255,0.3); }
  .header-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; }
  .header-sub { font-size: 0.74rem; opacity: 0.8; margin-top: 1px; }

  main { max-width: 560px; margin: 0 auto; padding: 1.1rem 1rem 2rem; }

  /* ══ HOME ══ */
  .home-hero {
    text-align: center;
    padding: 1.6rem 0 1.2rem;
  }
  .home-hero h1 {
    font-size: 1.3rem;
    margin: 0 0 0.3rem;
    color: var(--teal);
    letter-spacing: 0.04em;
  }
  .home-hero p { color: var(--muted); font-size: 0.85rem; margin: 0; }

  .class-grid { display: flex; flex-direction: column; gap: 0.9rem; }
  .class-card {
    display: flex; align-items: center; gap: 1rem;
    background: white;
    border-radius: 18px;
    padding: 1.1rem 1.2rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    text-align: left;
  }
  .class-card:active { transform: scale(0.98); }
  .class-icon {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden; background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(0,0,0,0.04);
  }
  .class-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .class-name { font-size: 1.08rem; font-weight: 700; color: var(--ink); }
  .class-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .class-arrow { margin-left: auto; color: var(--border); font-size: 1.3rem; }

  /* ══ AREA LIST ══ */
  .area-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .area-card {
    display: flex; align-items: center; gap: 0.8rem;
    background: white; border-radius: 14px; padding: 0.9rem 1.05rem;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    cursor: pointer;
  }
  .area-card:active { transform: scale(0.98); }
  .area-code {
    background: var(--teal); color: white; font-size: 0.76rem; font-weight: 700;
    padding: 3px 9px; border-radius: 8px; flex-shrink: 0;
  }
  .area-title { font-weight: 700; font-size: 0.98rem; }
  .area-count { margin-left: auto; font-size: 0.78rem; color: var(--muted); }
  .area-badge {
    font-size: 0.7rem; background: #ffe9c7; color: #8a5a00; padding: 2px 7px; border-radius: 7px; margin-left: 6px;
  }

  /* ══ ROSTER ══ */
  .member-chip .nobento-tag {
    margin-left: 4px; font-size: 0.68rem; font-weight: 700;
    color: var(--red); background: #fff; padding: 2px 7px; border-radius: 8px;
  }
  .member-chip.attend .nobento-tag { color: var(--red); background: #fff; }

  .bento-list-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; padding: 4px 2px;
  }
  .bento-list-arrow { font-size: 0.76rem; color: var(--teal); font-weight: 600; white-space: nowrap; }

  .bento-chip {
    display: flex; align-items: center; gap: 6px;
    background: white; border: 1.5px solid var(--border);
    border-radius: 12px; padding: 8px 12px;
    cursor: pointer; user-select: none; font-size: 0.9rem;
    transition: all 0.12s;
  }
  .bento-chip .name { font-weight: 600; }
  .bento-chip.selected {
    background: #fdecea; border-color: var(--red); color: var(--red);
  }

  .roster-toolbar {
    background: white; border-radius: 14px; padding: 0.9rem 1rem;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .toolbar-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
  .toolbar-row:last-child { margin-bottom: 0; }
  .toolbar-label { font-size: 0.8rem; color: var(--muted); flex-shrink: 0; width: 62px; }
  input[type="date"] {
    flex: 1; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; font-size: 0.88rem; font-family: inherit; color: var(--ink);
    background: var(--cream);
  }
  .quick-btns { display: flex; gap: 0.5rem; margin-left: auto; }
  .qbtn {
    border: 1px solid var(--border); background: white; color: var(--teal);
    font-size: 0.76rem; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .qbtn:active { background: var(--cream); }

  .role-section { margin-bottom: 0.9rem; }
  .role-title {
    font-size: 0.76rem; color: var(--muted); font-weight: 700;
    margin: 0.7rem 0 0.4rem 2px; letter-spacing: 0.05em;
  }
  .member-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .member-chip {
    display: flex; align-items: center; gap: 6px;
    background: white; border: 1.5px solid var(--border);
    border-radius: 12px; padding: 8px 12px;
    cursor: pointer; user-select: none;
    font-size: 0.9rem; transition: all 0.12s;
  }
  .member-chip .name { font-weight: 600; }
  .member-chip .role-tag { font-size: 0.62rem; color: var(--muted); }
  .member-chip.attend {
    background: linear-gradient(135deg, var(--green), #279d76);
    border-color: var(--green); color: white;
  }
  .member-chip.attend .role-tag { color: rgba(255,255,255,0.85); }
  .member-chip .bento-btn {
    margin-left: 4px; font-size: 0.7rem; padding: 2px 7px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.15); color: white; cursor: pointer;
    display: none;
  }
  .member-chip.attend .bento-btn { display: inline-block; }
  .member-chip.attend.nobento .bento-btn {
    background: #fff; color: var(--red); border-color: #fff; font-weight: 700;
  }

  .member-chip.editmode { border-style: dashed; border-color: var(--red); }
  .member-chip.editmode.attend { border-color: #fff; }
  .del-x {
    margin-left: 4px; color: rgba(255,255,255,0.85); font-weight: 900; font-size: 0.8rem;
    padding: 0 2px;
  }
  .member-chip.editmode .del-x {
    color: var(--red);
  }
  .member-chip.editmode.attend .del-x { color: #fff; }
  .add-chip {
    display: flex; align-items: center; gap: 4px;
    background: var(--cream); border: 1.5px dashed var(--border);
    border-radius: 12px; padding: 8px 12px; cursor: pointer;
    font-size: 0.88rem; color: var(--teal); font-weight: 600;
  }
  .add-chip:active { background: #efe6d0; }
  .service-toggle-row { display:flex; align-items:center; gap:0.5rem; margin: 0.9rem 0 0.3rem; }
  .service-input-row { display:flex; gap:0.5rem; margin-bottom:0.7rem; }
  .service-name-input {
    flex:1; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:0.9rem; font-family:inherit; color:var(--ink);
    background:var(--cream);
  }

  .summary-bar {
    position: sticky; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    padding: 0.8rem 1rem; margin: 1.2rem -1rem -2rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .summary-text { font-size: 0.84rem; color: var(--ink2); flex: 1; }
  .summary-text b { color: var(--green); }
  .btn-report {
    background: linear-gradient(135deg, #06C755, #05a648);
    color: white; border: none; border-radius: 12px;
    padding: 11px 18px; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(6,199,85,0.35);
  }
  .btn-report:active { transform: scale(0.97); }

  /* ══ MODAL ══ */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,20,30,0.55);
    z-index: 100; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white; border-radius: 16px; max-width: 420px; width: 100%;
    padding: 1.3rem; box-shadow: var(--shadow-lg); max-height: 86vh; overflow-y: auto;
  }
  .modal-title { font-weight: 700; font-size: 1rem; color: var(--teal); margin-bottom: 0.7rem; }
  .modal-preview {
    background: var(--cream); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.8rem; font-size: 0.86rem; line-height: 1.7; white-space: pre-wrap;
    max-height: 40vh; overflow-y: auto; margin-bottom: 1rem; font-family: inherit;
    width: 100%;
  }
  .modal-btns { display: flex; flex-direction: column; gap: 0.6rem; }
  .modal-btn {
    border: none; border-radius: 10px; padding: 11px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; text-align: center; text-decoration: none; display: block;
  }
  .modal-btn.line { background: linear-gradient(135deg, #06C755, #05a648); color: white; }
  .modal-btn.copy { background: var(--teal); color: white; }
  .modal-btn.close { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .modal-hint { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 0.6rem; }

  .empty-note { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 0; }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 18px; border-radius: 20px;
    font-size: 0.82rem; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <button class="header-back" id="btn-back" onclick="goBack()" style="display:none;">←</button>
  <div>
    <div class="header-title" id="header-title">三班報名點名系統</div>
    <div class="header-sub" id="header-sub">點選姓名代替參班簽到</div>
  </div>
</div>

<main id="main"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">📋 LINE 回報預覽</div>
    <textarea class="modal-preview" id="modal-preview" readonly></textarea>
    <div class="modal-btns">
      <a class="modal-btn line" id="btn-open-line" href="#">💬 開啟 LINE 傳送</a>
      <button class="modal-btn copy" onclick="copyReport()">📄 複製文字</button>
      <button class="modal-btn close" onclick="closeModal()">關閉</button>
    </div>
    <div class="modal-hint">若手機未自動跳轉 LINE，請改用「複製文字」後貼到 LINE 聊天室。</div>
  </div>
</div>

<div class="modal-overlay" id="add-member-overlay">
  <div class="modal-box">
    <div class="modal-title">➕ 新增人員</div>
    <div class="toolbar-row" style="margin-bottom:0.9rem;">
      <div class="toolbar-label">身份</div>
      <select id="add-member-role" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.92rem;font-family:inherit;color:var(--ink);background:var(--cream);"></select>
    </div>
    <div class="toolbar-row" style="margin-bottom:1rem;">
      <div class="toolbar-label">姓名</div>
      <input type="text" id="add-member-name" placeholder="請輸入姓名" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.92rem;font-family:inherit;color:var(--ink);background:var(--cream);">
    </div>
    <div id="add-member-error" style="display:none;color:var(--red);font-size:0.8rem;margin:-0.5rem 0 0.8rem;"></div>
    <div class="modal-btns">
      <button class="modal-btn line" onclick="confirmAddMember()">確認新增</button>
      <button class="modal-btn close" onclick="closeAddMemberModal()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      {role:"學員",gender:"坤道",area:"馬光",code:"2區",name:"珮安"},
      {role:"策劃",gender:"坤道",area:"斗六",code:"2區",name:"淑貞"},
      {role:"陪班",gender:"坤道",area:"嘉義",code:"2區",name:"美蓉"},
    ]
  }
};

// ══════════════════════════════════════════
// 狀態管理
// ══════════════════════════════════════════
const LS_KEY = 'sanban_roster_state_v1';
let state = { nav: 'home', classKey: null, areaCode: null, editMode: false, bentoListOpen: false };
let data = loadData();

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && typeof d === 'object') return d;
  } catch(e) {}
  return {};
}
function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}
function ensurePath(classKey, code, name) {
  if (!data[classKey]) data[classKey] = {};
  if (!data[classKey][code]) data[classKey][code] = {};
  if (!data[classKey][code][name]) data[classKey][code][name] = { attend:false, noBento:false };
  return data[classKey][code][name];
}

// ══════════════════════════════════════════
// 新增／刪除人員、服務人員名單
// ══════════════════════════════════════════
function ensureCustom(classKey, areaCode) {
  if (!data.custom) data.custom = {};
  if (!data.custom[classKey]) data.custom[classKey] = {};
  if (!data.custom[classKey][areaCode]) {
    data.custom[classKey][areaCode] = { added: [], removed: [], service: [] };
  }
  const c = data.custom[classKey][areaCode];
  if (!c.added) c.added = [];
  if (!c.removed) c.removed = [];
  if (!c.service) c.service = [];
  return c;
}

function getEffectiveMembers(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const custom = ensureCustom(classKey, areaCode);
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const staticMembers = cls.members.filter(m => m.code === areaCode && !custom.removed.includes(m.name));
  const addedMembers = custom.added
    .filter(m => !custom.removed.includes(m.name))
    .map(m => ({ role: m.role, name: m.name, code: areaCode, area: areaInfo ? areaInfo.area : '', gender: '' }));
  return staticMembers.concat(addedMembers);
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  render();
}

function toggleBentoListOpen() {
  state.bentoListOpen = !state.bentoListOpen;
  render();
}

let addMemberCtx = { classKey: null, areaCode: null };

function openAddMemberModal(classKey, areaCode) {
  const cls = CLASSES[classKey];
  addMemberCtx = { classKey, areaCode };
  const sel = document.getElementById('add-member-role');
  sel.innerHTML = cls.roleOrder.map(r => `<option value="${r}">${r}</option>`).join('');
  document.getElementById('add-member-name').value = '';
  document.getElementById('add-member-error').style.display = 'none';
  document.getElementById('add-member-overlay').classList.add('show');
}

function closeAddMemberModal() {
  document.getElementById('add-member-overlay').classList.remove('show');
}

function confirmAddMember() {
  const { classKey, areaCode } = addMemberCtx;
  if (!classKey || !areaCode) return;
  const name = document.getElementById('add-member-name').value.trim();
  const role = document.getElementById('add-member-role').value;
  const errBox = document.getElementById('add-member-error');
  if (!name) { errBox.textContent = '請輸入姓名'; errBox.style.display = 'block'; return; }
  const existing = getEffectiveMembers(classKey, areaCode).some(m => m.name === name);
  if (existing) { errBox.textContent = '此區組已有同名人員，請確認後再新增。'; errBox.style.display = 'block'; return; }
  const custom = ensureCustom(classKey, areaCode);
  custom.added.push({ role, name });
  custom.removed = custom.removed.filter(n => n !== name);
  saveData();
  closeAddMemberModal();
  render();
  showToastMsg(`已新增「${name}」（${role}）`);
}

function deleteMember(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  if (custom.added.some(m => m.name === name)) {
    custom.added = custom.added.filter(m => m.name !== name);
  } else if (!custom.removed.includes(name)) {
    custom.removed.push(name);
  }
  saveData();
  render();
  showToastMsg(`已刪除「${name}」`);
}

function addServicePerson(classKey, areaCode) {
  const input = document.getElementById(`service-name-input-${areaCode}`);
  const raw = (input.value || '').trim();
  if (!raw) return;
  const names = raw.split(/[、,，]/).map(n => n.trim()).filter(Boolean);
  if (names.length === 0) return;
  const custom = ensureCustom(classKey, areaCode);
  const added = [];
  const dup = [];
  for (const name of names) {
    if (custom.service.some(s => s.name === name) || added.includes(name)) {
      dup.push(name);
      continue;
    }
    custom.service.push({ name, noBento: false });
    added.push(name);
  }
  saveData();
  input.value = '';
  render();
  if (added.length && dup.length) {
    showToastMsg(`已加入：${added.join('、')}（重複略過：${dup.join('、')}）`);
  } else if (added.length) {
    showToastMsg(`已加入服務人員：${added.join('、')}`);
  } else if (dup.length) {
    showToastMsg(`「${dup.join('、')}」已在名單中`);
  }
}

function removeServicePerson(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  custom.service = custom.service.filter(s => s.name !== name);
  saveData();
  render();
  showToastMsg(`已移除服務人員「${name}」`);
}

function toggleServiceBento(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  const s = custom.service.find(s => s.name === name);
  if (!s) return;
  s.noBento = !s.noBento;
  saveData();
  render();
}

function showToastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// ══════════════════════════════════════════
// 導覽
// ══════════════════════════════════════════
function goHome() {
  state = { nav: 'home', classKey: null, areaCode: null, editMode: false, bentoListOpen: false };
  render();
}
function goClass(classKey) {
  state = { nav: 'class', classKey, areaCode: null, editMode: false, bentoListOpen: false };
  render();
}
function goRoster(classKey, areaCode) {
  state = { nav: 'roster', classKey, areaCode, editMode: false, bentoListOpen: false };
  render();
}
function goBack() {
  if (state.nav === 'roster') goClass(state.classKey);
  else if (state.nav === 'class') goHome();
}

// ══════════════════════════════════════════
// 渲染
// ══════════════════════════════════════════
function render() {
  const main = document.getElementById('main');
  const backBtn = document.getElementById('btn-back');
  const title = document.getElementById('header-title');
  const sub = document.getElementById('header-sub');

  if (state.nav === 'home') {
    backBtn.style.display = 'none';
    title.textContent = '三班報名點名系統';
    sub.textContent = '點選姓名代替參班簽到';
    main.innerHTML = renderHome();
  } else if (state.nav === 'class') {
    backBtn.style.display = 'flex';
    const cls = CLASSES[state.classKey];
    title.textContent = cls.fullName;
    sub.textContent = '請選擇區組';
    main.innerHTML = renderAreaList(state.classKey);
  } else if (state.nav === 'roster') {
    backBtn.style.display = 'flex';
    const cls = CLASSES[state.classKey];
    const areaInfo = cls.areaOrder.find(a => a.code === state.areaCode);
    title.textContent = cls.fullName;
    sub.textContent = areaLabel(cls, areaInfo);
    main.innerHTML = renderRoster(state.classKey, state.areaCode);
  }
}

function renderHome() {
  let html = `<div class="home-hero">
    <h1>三班人員名單</h1>
    <p>請選擇要報名點名的班別</p>
  </div><div class="class-grid">`;
  for (const key of ['child','youth','elder']) {
    const c = CLASSES[key];
    html += `<div class="class-card ${c.cardClass}" onclick="goClass('${key}')">
      <div class="class-icon"><img src="${c.iconImg}" alt="${c.label}"></div>
      <div>
        <div class="class-name">${c.label}</div>
        <div class="class-desc">${c.fullName} · ${c.desc}</div>
      </div>
      <div class="class-arrow">›</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function areaLabel(cls, areaInfo) {
  if (!areaInfo) return '';
  if (areaInfo.code === '2區') return '2區';
  return `${areaInfo.code} ${areaInfo.area}區`;
}

function renderAreaList(classKey) {
  const cls = CLASSES[classKey];
  let html = `<div class="area-list">`;
  for (const a of cls.areaOrder) {
    const members = getEffectiveMembers(classKey, a.code);
    const attendCount = members.filter(m => {
      const rec = data[classKey] && data[classKey][a.code] && data[classKey][a.code][m.name];
      return rec && rec.attend;
    }).length;
    html += `<div class="area-card" onclick="goRoster('${classKey}','${a.code}')">
      <div class="area-code">${a.code}</div>
      <div class="area-title">${areaLabel(cls, a)}</div>
      <div class="area-count">${members.length} 人${attendCount ? `<span class="area-badge">已選 ${attendCount}</span>` : ''}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// 各班預設上課日規則：weekday 0=週日...6=週六，n=第幾個
const CLASS_DATE_RULES = {
  child: { weekday: 0, n: 3 }, // 童蒙班：每月第三個禮拜天
  youth: { weekday: 0, n: 4 }, // 青少班：每月第四個禮拜天
  elder: { weekday: 6, n: 1 }, // 學人班：每月第一個禮拜六
};

function nthWeekdayOfMonth(year, month0, weekday, n) {
  const first = new Date(year, month0, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  const day = 1 + offset + (n - 1) * 7;
  return new Date(year, month0, day);
}

function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDefaultClassDate(classKey) {
  const rule = CLASS_DATE_RULES[classKey];
  if (!rule) return todayStr();
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let target = nthWeekdayOfMonth(today.getFullYear(), today.getMonth(), rule.weekday, rule.n);
  if (target < todayMid) {
    target = nthWeekdayOfMonth(today.getFullYear(), today.getMonth() + 1, rule.weekday, rule.n);
  }
  return toDateStr(target);
}

function renderRoster(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const members = getEffectiveMembers(classKey, areaCode);
  const custom = ensureCustom(classKey, areaCode);
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const dateKey = `date_${classKey}`;
  const savedDate = data[dateKey] || getDefaultClassDate(classKey);
  const editMode = state.editMode;

  let html = `<div class="roster-toolbar">
    <div class="toolbar-row">
      <div class="toolbar-label">開班日期</div>
      <input type="date" id="report-date" value="${savedDate}" onchange="onDateChange('${classKey}')">
    </div>
    <div class="toolbar-row">
      <div class="toolbar-label">快速選取</div>
      <div class="quick-btns">
        <button class="qbtn" onclick="selectAll('${classKey}','${areaCode}',true)">全選</button>
        <button class="qbtn" onclick="selectAll('${classKey}','${areaCode}',false)">清除</button>
        <button class="qbtn" onclick="toggleEditMode()" style="${editMode ? 'background:var(--red);color:white;border-color:var(--red);' : ''}">${editMode ? '✅ 完成編輯' : '✏️ 新增/刪除'}</button>
      </div>
    </div>
  </div>`;

  if (editMode) {
    html += `<div class="empty-note" style="padding:0.6rem 0 1rem;color:var(--red);">編輯模式中：點選人員即可刪除，或用下方「＋ 新增人員」加入新成員。</div>`;
  }

  if (members.length === 0 && !editMode) {
    html += `<div class="empty-note">此區組尚無人員資料</div>`;
  }

  for (const role of cls.roleOrder) {
    const roleMembers = members.filter(m => m.role === role)
      .sort((a,b) => {
        const g = genderRank(a.gender) - genderRank(b.gender);
        if (g !== 0) return g;
        return a.name.localeCompare(b.name, 'zh-Hant');
      });
    if (roleMembers.length === 0) continue;
    html += `<div class="role-section">
      <div class="role-title">${role}</div>
      <div class="member-grid">`;
    for (const m of roleMembers) {
      const rec = ensurePath(classKey, areaCode, m.name);
      const chipClasses = ['member-chip'];
      if (rec.attend) chipClasses.push('attend');
      if (editMode) chipClasses.push('editmode');
      const subTag = (classKey === 'elder' && areaCode === '2區') ? `<span class="role-tag">(${m.area})</span>` : '';
      const clickAction = editMode
        ? `deleteMember('${classKey}','${areaCode}','${m.name}')`
        : `toggleAttend('${classKey}','${areaCode}','${m.name}')`;
      const delX = editMode ? `<span class="del-x">✕</span>` : '';
      html += `<div class="${chipClasses.join(' ')}" onclick="${clickAction}">
        <span class="name">${m.name}</span>${subTag}${delX}
      </div>`;
    }
    html += `</div></div>`;
  }

  if (editMode) {
    html += `<div class="role-section"><div class="member-grid">
      <div class="add-chip" onclick="openAddMemberModal('${classKey}','${areaCode}')">＋ 新增人員</div>
    </div></div>`;
  }

  // ── 服務人員名單 ──
  html += `<div class="role-section">
    <div class="role-title" style="margin-bottom:0.5rem;">服務人員名單 <span style="font-weight:400;color:var(--muted);">(各名字後面用、區別)</span></div>
    <div class="service-input-row">
      <input type="text" id="service-name-input-${areaCode}" class="service-name-input" placeholder="例如：阿黎、阿森" onkeydown="if(event.key==='Enter'){addServicePerson('${classKey}','${areaCode}');}">
      <button class="qbtn" onclick="addServicePerson('${classKey}','${areaCode}')">新增</button>
    </div>
    <div class="member-grid">`;
  if (custom.service.length === 0) {
    html += `<div class="empty-note" style="padding:0.4rem 0;">尚未輸入服務人員</div>`;
  }
  for (const s of custom.service.sort((a,b) => a.name.localeCompare(b.name,'zh-Hant'))) {
    const chipClasses = ['member-chip', 'attend'];
    if (editMode) chipClasses.push('editmode');
    html += `<div class="${chipClasses.join(' ')}">
      <span class="name">${s.name}</span><span class="del-x" onclick="event.stopPropagation();removeServicePerson('${classKey}','${areaCode}','${s.name}')">✕</span>
    </div>`;
  }
  html += `</div></div>`;

  const attendList = members.filter(m => {
    const rec = data[classKey][areaCode][m.name];
    return rec && rec.attend;
  });

  // ── 不要便當名單 ──
  if (!editMode && (attendList.length > 0 || custom.service.length > 0)) {
    const bentoOpen = !!state.bentoListOpen;
    html += `<div class="role-section">
      <div class="bento-list-header" onclick="toggleBentoListOpen()">
        <span class="role-title" style="margin:0;">🚫不要便當人員：<span style="color:var(--red);font-weight:700;">請在名單上再點選一下</span></span>
        <span class="bento-list-arrow">${bentoOpen ? '▲ 收合' : '▼ 展開'}</span>
      </div>`;
    if (bentoOpen) {
      html += `<div class="member-grid" style="margin-top:0.5rem;">`;
      for (const m of attendList) {
        const rec = data[classKey][areaCode][m.name];
        html += `<div class="bento-chip${rec.noBento ? ' selected' : ''}" onclick="toggleBento('${classKey}','${areaCode}','${m.name}')">
          <span class="name">${m.name}</span>
        </div>`;
      }
      for (const s of custom.service) {
        html += `<div class="bento-chip${s.noBento ? ' selected' : ''}" onclick="toggleServiceBento('${classKey}','${areaCode}','${s.name}')">
          <span class="name">${s.name}</span>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  html += `<div class="summary-bar">
    <div class="summary-text">已選 <b>${attendList.length}</b> / ${members.length} 人${custom.service.length ? ` ・ 服務 ${custom.service.length} 人` : ''}</div>
    <button class="btn-report" onclick="openReport('${classKey}','${areaCode}')">📱 產生LINE回報</button>
  </div>`;

  return html;
}

function onDateChange(classKey) {
  const val = document.getElementById('report-date').value;
  data[`date_${classKey}`] = val;
  saveData();
}

function toggleAttend(classKey, areaCode, name) {
  const rec = ensurePath(classKey, areaCode, name);
  rec.attend = !rec.attend;
  if (!rec.attend) rec.noBento = false;
  saveData();
  render();
}

function toggleBento(classKey, areaCode, name) {
  const rec = ensurePath(classKey, areaCode, name);
  if (!rec.attend) return;
  rec.noBento = !rec.noBento;
  saveData();
  render();
}

function selectAll(classKey, areaCode, value) {
  const members = getEffectiveMembers(classKey, areaCode);
  for (const m of members) {
    const rec = ensurePath(classKey, areaCode, m.name);
    rec.attend = value;
    if (!value) rec.noBento = false;
  }
  saveData();
  render();
}

// ══════════════════════════════════════════
// LINE 回報
// ══════════════════════════════════════════
function formatDateForReport(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function genderRank(g) {
  if (g === '乾道') return 0;
  if (g === '坤道') return 1;
  return 2;
}

function chunkNamesToLines(names, perLine) {
  const lines = [];
  for (let i = 0; i < names.length; i += perLine) {
    lines.push(names.slice(i, i + perLine).join('、'));
  }
  return lines;
}

function buildReportText(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const members = getEffectiveMembers(classKey, areaCode);
  const custom = ensureCustom(classKey, areaCode);
  const dateStr = data[`date_${classKey}`] || getDefaultClassDate(classKey);

  const attendNames = [];
  const noBentoNames = [];
  for (const role of cls.roleOrder) {
    const roleMembers = members.filter(m => m.role === role)
      .sort((a, b) => {
        const g = genderRank(a.gender) - genderRank(b.gender);
        if (g !== 0) return g;
        return a.name.localeCompare(b.name, 'zh-Hant');
      });
    for (const m of roleMembers) {
      const rec = data[classKey] && data[classKey][areaCode] && data[classKey][areaCode][m.name];
      if (rec && rec.attend) {
        attendNames.push(m.name);
        if (rec.noBento) noBentoNames.push(m.name);
      }
    }
  }

  let text = `${formatDateForReport(dateStr)}\n${cls.fullName}\n${areaLabel(cls, areaInfo)}\n參加人員名單如下：\n`;
  text += attendNames.length ? chunkNamesToLines(attendNames, 3).join('\n') : '（尚未選取人員）';

  if (custom.service.length) {
    const serviceSorted = custom.service.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    const serviceNames = serviceSorted.map(s => s.name);
    for (const s of serviceSorted) {
      if (s.noBento) noBentoNames.push(s.name);
    }
    text += `\n\n服務人員：\n${chunkNamesToLines(serviceNames, 3).join('\n')}`;
  }

  if (noBentoNames.length) {
    text += `\n\n不要便當：\n${chunkNamesToLines(noBentoNames, 3).join('\n')}`;
  }

  return text;
}

function openReport(classKey, areaCode) {
  const text = buildReportText(classKey, areaCode);
  const preview = document.getElementById('modal-preview');
  preview.value = text;
  preview.rows = Math.min(16, text.split('\n').length + 1);
  document.getElementById('btn-open-line').href = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function copyReport() {
  const preview = document.getElementById('modal-preview');
  preview.select();
  preview.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(preview.value).then(showCopiedToast, () => {
      document.execCommand('copy');
      showCopiedToast();
    });
  } catch(e) {
    document.execCommand('copy');
    showCopiedToast();
  }
}

function showCopiedToast() {
  const t = document.getElementById('toast');
  t.textContent = '已複製到剪貼簿';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('add-member-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'add-member-overlay') closeAddMemberModal();
});

// ══════════════════════════════════════════
// 初始
// ══════════════════════════════════════════
render();
</script>
