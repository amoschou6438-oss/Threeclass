<style>
:root{--ink:#0f2f52;--child:#14929c;--youth:#4a8527;--elder:#12365f;--gold:#f0ad2e;--paper:#f6f8f7;--line:#dce4e2;--muted:#5d6f7c;--red:#c0392b;
--serif:'Noto Serif TC','Songti TC','PMingLiU',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#dfe6e4}
body{margin:0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);--c:var(--ink)}
body[data-theme=child]{--c:var(--child)}body[data-theme=youth]{--c:var(--youth)}body[data-theme=elder]{--c:var(--elder)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;overflow-x:hidden}
.back{width:40px;height:40px;border-radius:50%;background:rgba(15,47,82,.08);font-size:1.7rem;line-height:1;display:grid;place-items:center;text-align:center;flex:none;padding-bottom:3px}
/* cover */
.cover{min-height:100dvh;display:flex;flex-direction:column}
.cover-logo{flex:1;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px 8px}
.cover-logo img{width:min(78vw,360px);height:auto}
.cover-sheet{background:var(--ink);border-radius:30px 30px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.go{display:flex;align-items:center;justify-content:space-between;background:var(--gold);color:var(--ink);font-weight:700;font-size:1.15rem;padding:18px 22px;border-radius:18px}
.star{width:22px;height:22px;background:var(--ink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.cover-sub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cover-sub button{border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:14px 8px;text-align:center;font-size:.88rem}
/* class select */
.plain-top{display:flex;gap:14px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px}
.plain-top h2{margin:0;font:700 1.25rem var(--serif)}
.plain-top p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.bands{display:grid;gap:12px;padding:6px 14px 24px}
.band{position:relative;overflow:hidden;background:var(--c);color:#fff;border-radius:26px;min-height:max(150px,calc((100dvh - 130px)/3 - 12px));padding:22px;display:flex;justify-content:space-between;align-items:flex-end;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.band:nth-child(2){animation-delay:.08s}.band:nth-child(3){animation-delay:.16s}
.band::after{content:"";position:absolute;right:-46px;top:-46px;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3)}
.band-txt{display:grid;gap:4px}
.band-full{font-size:.82rem;opacity:.9}
.band-name{font:900 3.2rem/1.05 var(--serif);letter-spacing:.04em}
.band-next{font-size:.82rem;margin-top:4px}
.medal{position:absolute;right:22px;top:22px;z-index:1;width:84px;height:84px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 3px var(--gold)}
.medal img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
/* masthead */
.mast{background:var(--c);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 26px;border-radius:0 0 30px 30px}
.mast .back{background:rgba(255,255,255,.18);margin-bottom:18px}
.mast p{margin:0;font-size:.88rem;opacity:.9}
.mast h1{margin:4px 0 0;font:900 2.7rem/1.1 var(--serif);letter-spacing:.03em}
.mast-stat{margin-top:12px;font-size:.9rem}.mast-stat b{font:900 1.6rem var(--serif)}
/* area rows */
.arows{padding:8px 20px 40px}
.arow{display:grid;grid-template-columns:82px 1fr auto;align-items:baseline;width:100%;padding:18px 0 14px;border-bottom:1px solid var(--line);row-gap:12px}
.acode{font:900 1.9rem/1 var(--serif);color:var(--c)}
.aname{font-weight:700;font-size:1.05rem}
.acount{font-size:.85rem;color:var(--muted)}.acount b{font-size:1.15rem;color:var(--ink)}
.meter{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
/* roster */
.tools{padding:18px 20px 4px;display:grid;gap:12px}
.date{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.date span{font-size:.85rem;color:var(--muted)}
.date input{border:0;background:none;font:700 1rem inherit;font-family:inherit;color:var(--ink);text-align:right}
.tool-btns{display:flex;gap:8px}
.tool-btns button{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:700}
.tool-btns button:last-child{margin-left:auto}
.tool-btns .is-on{background:var(--red);border-color:var(--red);color:#fff}
.note{margin:12px 20px 0;font-size:.85rem;color:var(--red)}
.sec{padding:22px 20px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h3{margin:0;font:700 1.1rem var(--serif)}
.sec-h em{font-style:normal;font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tile{position:relative;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;font-weight:600;font-size:1rem;padding:6px 4px;text-align:center;user-select:none}
.tile small{font-size:.65rem;font-weight:400;color:var(--muted)}
.tile.on{background:var(--c);border-color:var(--c);color:#fff}.tile.on small{color:rgba(255,255,255,.85)}
.tile.on::after{content:"✓";position:absolute;top:3px;right:8px;font-size:.62rem}
.tile.edit{border-style:dashed;border-color:var(--red)}
.tile.edit::after{content:"✕"!important;color:var(--red);top:2px;right:7px}
.tile.on.edit::after{color:#fff}
.tile.svc::after{content:none}
.tile .x{position:absolute;top:0;right:0;padding:4px 9px;font-size:.72rem}
.tile.add{border-style:dashed;border-color:var(--c);color:var(--c);background:transparent}
.tile.no{background:#fdecea;border-color:var(--red);color:var(--red)}
.svc-row{display:flex;gap:8px;margin-bottom:10px}
.svc-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font:inherit;color:var(--ink)}
.svc-row button{background:var(--c);color:#fff;border-radius:14px;padding:0 18px;font-weight:700}
.empty{font-size:.85rem;color:var(--muted);padding:6px 0;grid-column:1/-1}
.bento-h{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;gap:10px}
.bento-h span{font-size:.92rem;font-weight:700}.bento-h small{display:block;font-weight:400;color:var(--red);font-size:.78rem;margin-top:2px}
.bento-h i{font-style:normal;color:var(--c);font-size:.8rem;font-weight:700;white-space:nowrap}
.pad{height:120px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line)}
.dock-in{max-width:520px;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.dock-n{flex:1;font-size:.82rem;color:var(--muted)}.dock-n b{font:900 2rem/1 var(--serif);color:var(--c)}
.dock-go{background:#06c755;color:#fff;font-weight:700;padding:14px 20px;border-radius:16px;white-space:nowrap}
/* sheets */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,25,45,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--paper);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90dvh;overflow:auto;animation:sheet .28s ease both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.modal-title{font:700 1.15rem var(--serif);margin-bottom:12px}
.modal-preview{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:.9rem;line-height:1.8;resize:none;color:var(--ink);margin-bottom:14px}
.modal-btns{display:grid;gap:10px}
.modal-btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px;font-weight:700}
.modal-btn.line{background:#06c755;color:#fff}.modal-btn.copy{background:var(--ink);color:#fff}.modal-btn.close{border:1px solid var(--line);color:var(--muted);font-weight:500}
.modal-hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:10px}
.field{display:flex;align-items:center;gap:12px;margin-bottom:14px}.field label{width:44px;font-size:.85rem;color:var(--muted)}
.field select,.field input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
.field-err{display:none;color:var(--red);font-size:.82rem;margin:-6px 0 12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.band,.modal-box{animation:none}}

</style>
</head>
<body data-theme="main">
<main id="main"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">LINE 回報預覽</div>
    <textarea class="modal-preview" id="modal-preview" readonly></textarea>
    <div class="modal-btns">
      <a class="modal-btn line" id="btn-open-line" href="#">開啟 LINE 傳送</a>
      <button class="modal-btn copy" onclick="copyReport()">複製文字</button>
      <button class="modal-btn close" onclick="closeModal()">關閉</button>
    </div>
    <div class="modal-hint">若手機未自動跳轉 LINE，請改用「複製文字」後貼到 LINE 聊天室。</div>
  </div>
</div>

<div class="modal-overlay" id="add-member-overlay">
  <div class="modal-box">
    <div class="modal-title">新增人員</div>
    <div class="field"><label for="add-member-role">身份</label><select id="add-member-role"></select></div>
    <div class="field"><label for="add-member-name">姓名</label><input type="text" id="add-member-name" placeholder="請輸入姓名"></div>
    <div class="field-err" id="add-member-error"></div>
    <div class="modal-btns">
      <button class="modal-btn line" onclick="confirmAddMember()">確認新增</button>
      <button class="modal-btn close" onclick="closeAddMemberModal()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      {role:"策劃",gender:"坤道",area:"斗六",code:"2區",name:"淑貞"},
      {role:"陪班",gender:"坤道",area:"嘉義",code:"2區",name:"美蓉"},

// 狀態管理
// ══════════════════════════════════════════
const LS_KEY = 'sanban_roster_state_v1';
let state = { nav: 'mainmenu', classKey: null, areaCode: null, editMode: false, bentoListOpen: false };
let data = loadData();

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && typeof d === 'object') return d;
  } catch(e) {}
  return {};
}
function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}
function ensurePath(classKey, code, name) {
  if (!data[classKey]) data[classKey] = {};
  if (!data[classKey][code]) data[classKey][code] = {};
  if (!data[classKey][code][name]) data[classKey][code][name] = { attend:false, noBento:false };
  return data[classKey][code][name];
}

// ══════════════════════════════════════════
// 新增／刪除人員、服務人員名單
// ══════════════════════════════════════════
function ensureCustom(classKey, areaCode) {
  if (!data.custom) data.custom = {};
  if (!data.custom[classKey]) data.custom[classKey] = {};
  if (!data.custom[classKey][areaCode]) {
    data.custom[classKey][areaCode] = { added: [], removed: [], service: [] };
  }
  const c = data.custom[classKey][areaCode];
  if (!c.added) c.added = [];
  if (!c.removed) c.removed = [];
  if (!c.service) c.service = [];
  return c;
}

function getEffectiveMembers(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const custom = ensureCustom(classKey, areaCode);
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const staticMembers = cls.members.filter(m => m.code === areaCode && !custom.removed.includes(m.name));
  const addedMembers = custom.added
    .filter(m => !custom.removed.includes(m.name))
    .map(m => ({ role: m.role, name: m.name, code: areaCode, area: areaInfo ? areaInfo.area : '', gender: '' }));
  return staticMembers.concat(addedMembers);
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  render();
}

function toggleBentoListOpen() {
  state.bentoListOpen = !state.bentoListOpen;
  render();
}

let addMemberCtx = { classKey: null, areaCode: null };

function openAddMemberModal(classKey, areaCode) {
  const cls = CLASSES[classKey];
  addMemberCtx = { classKey, areaCode };
  const sel = document.getElementById('add-member-role');
  sel.innerHTML = cls.roleOrder.map(r => `<option value="${r}">${r}</option>`).join('');
  document.getElementById('add-member-name').value = '';
  document.getElementById('add-member-error').style.display = 'none';
  document.getElementById('add-member-overlay').classList.add('show');
}

function closeAddMemberModal() {
  document.getElementById('add-member-overlay').classList.remove('show');
}

function confirmAddMember() {
  const { classKey, areaCode } = addMemberCtx;
  if (!classKey || !areaCode) return;
  const name = document.getElementById('add-member-name').value.trim();
  const role = document.getElementById('add-member-role').value;
  const errBox = document.getElementById('add-member-error');
  if (!name) { errBox.textContent = '請輸入姓名'; errBox.style.display = 'block'; return; }
  const existing = getEffectiveMembers(classKey, areaCode).some(m => m.name === name);
  if (existing) { errBox.textContent = '此區組已有同名人員，請確認後再新增。'; errBox.style.display = 'block'; return; }
  const custom = ensureCustom(classKey, areaCode);
  custom.added.push({ role, name });
  custom.removed = custom.removed.filter(n => n !== name);
  saveData();
  closeAddMemberModal();
  render();
  showToastMsg(`已新增「${name}」（${role}）`);
}

function deleteMember(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  if (custom.added.some(m => m.name === name)) {
    custom.added = custom.added.filter(m => m.name !== name);
  } else if (!custom.removed.includes(name)) {
    custom.removed.push(name);
  }
  saveData();
  render();
  showToastMsg(`已刪除「${name}」`);
}

function addServicePerson(classKey, areaCode) {
  const input = document.getElementById(`service-name-input-${areaCode}`);
  const raw = (input.value || '').trim();
  if (!raw) return;
  const names = raw.split(/[、,，]/).map(n => n.trim()).filter(Boolean);
  if (names.length === 0) return;
  const custom = ensureCustom(classKey, areaCode);
  const added = [];
  const dup = [];
  for (const name of names) {
    if (custom.service.some(s => s.name === name) || added.includes(name)) {
      dup.push(name);
      continue;
    }
    custom.service.push({ name, noBento: false });
    added.push(name);
  }
  saveData();
  input.value = '';
  render();
  if (added.length && dup.length) {
    showToastMsg(`已加入：${added.join('、')}（重複略過：${dup.join('、')}）`);
  } else if (added.length) {
    showToastMsg(`已加入服務人員：${added.join('、')}`);
  } else if (dup.length) {
    showToastMsg(`「${dup.join('、')}」已在名單中`);
  }
}

function removeServicePerson(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  custom.service = custom.service.filter(s => s.name !== name);
  saveData();
  render();
  showToastMsg(`已移除服務人員「${name}」`);
}

function toggleServiceBento(classKey, areaCode, name) {
  const custom = ensureCustom(classKey, areaCode);
  const s = custom.service.find(s => s.name === name);
  if (!s) return;
  s.noBento = !s.noBento;
  saveData();
  render();
}

function showToastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// ══════════════════════════════════════════
function goMainMenu() {
  state = { nav: 'mainmenu', classKey: null, areaCode: null, editMode: false, bentoListOpen: false };
  render();
}
function goHome() {
  state = { nav: 'home', classKey: null, areaCode: null, editMode: false, bentoListOpen: false };
  render();
}
function goClass(classKey) {
  state = { nav: 'class', classKey, areaCode: null, editMode: false, bentoListOpen: false };
  render();
}
function goRoster(classKey, areaCode) {
  state = { nav: 'roster', classKey, areaCode, editMode: false, bentoListOpen: false };

// ══════════════════════════════════════════
// 名單資料 匯出／匯入
// ══════════════════════════════════════════
function exportRosterData() {
  try {
    const payload = {
      type: 'sanban_roster_export',
      version: 1,
      exportedAt: new Date().toISOString(),
      data: data
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = todayStr();
    a.href = url;
    a.download = `三班人員名單_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToastMsg('已匯出名單資料');
  } catch (e) {
    showToastMsg('匯出失敗');
  }
}

function triggerImportRoster() {
  const input = document.getElementById('import-roster-input');
  if (input) input.click();
}

function handleImportRosterFile(evt) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const incoming = (parsed && parsed.type === 'sanban_roster_export' && parsed.data) ? parsed.data : parsed;
      if (!incoming || typeof incoming !== 'object') throw new Error('格式錯誤');
      data = incoming;
      saveData();
      showToastMsg('名單資料匯入成功');
      render();
    } catch (err) {
      showToastMsg('匯入失敗：檔案格式不正確');
    } finally {
      evt.target.value = '';
    }
  };
  reader.readAsText(file, 'utf-8');
}

// ══ 渲染（重新設計）══
let lastView = '';
function render() {
  const main = document.getElementById('main');
  document.body.dataset.theme = state.classKey || 'main';
  const view = [state.nav, state.classKey, state.areaCode].join('|');
  const y = window.scrollY;
  if (state.nav === 'mainmenu') main.innerHTML = renderMainMenu();
  else if (state.nav === 'home') main.innerHTML = renderHome();
  else if (state.nav === 'class') main.innerHTML = renderAreaList(state.classKey);
  else main.innerHTML = renderRoster(state.classKey, state.areaCode);
  window.scrollTo(0, view !== lastView ? 0 : y);
  lastView = view;
}

function renderMainMenu() {
  return `<section class="cover">
    <div class="cover-logo"><img src="data:image/png;base64,${LOGO_IMG}" alt="中區報名系統"></div>
    <div class="cover-sheet">
      <button class="go" onclick="goHome()"><span>進入報名系統</span><i class="star"></i></button>
      <div class="cover-sub">
        <button onclick="exportRosterData()">各班人員名單匯出</button>
        <button onclick="triggerImportRoster()">各班人員名單匯入</button>
      </div>
    </div>
    <input type="file" id="import-roster-input" accept=".json,application/json" hidden onchange="handleImportRosterFile(event)">
  </section>`;
}

function fmtNext(key) {
  const d = new Date(getDefaultClassDate(key) + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日（週${'日一二三四五六'[d.getDay()]}）`;
}

function renderHome() {
  let h = `<div class="plain-top"><button class="back" onclick="goBack()" aria-label="返回">‹</button>
    <div><h2>報名系統</h2><p>請選擇要報名的班別</p></div></div><div class="bands">`;
  for (const key of ['child', 'youth', 'elder']) {
    const c = CLASSES[key];
    h += `<button class="band" style="--c:var(--${key})" onclick="goClass('${key}')">
      <span class="band-txt"><span class="band-full">${c.fullName}</span><span class="band-name">${c.label}</span><span class="band-next">下次開班　${fmtNext(key)}</span></span>
      <span class="medal"><img src="${c.iconImg}" alt=""></span>
    </button>`;
  }
  return h + `</div>`;
}

function attendOf(classKey, code, name) {
  const r = data[classKey] && data[classKey][code] && data[classKey][code][name];
  return !!(r && r.attend);
}

function renderAreaList(classKey) {
  const cls = CLASSES[classKey];
  let tot = 0, sel = 0, rows = '';
  for (const a of cls.areaOrder) {
    const ms = getEffectiveMembers(classKey, a.code);
    const n = ms.filter(m => attendOf(classKey, a.code, m.name)).length;
    tot += ms.length; sel += n;
    const name = a.code === '2區'
      ? [...new Set(cls.members.filter(m => m.code === a.code).map(m => m.area))].join('、')
      : a.area + '區';
    rows += `<button class="arow" onclick="goRoster('${classKey}','${a.code}')">
      <span class="acode">${a.code}</span><span class="aname">${name}</span>
      <span class="acount"><b>${n}</b> / ${ms.length} 人</span>
      <span class="meter"><i style="width:${ms.length ? Math.round(n / ms.length * 100) : 0}%"></i></span>
    </button>`;
  }
  return `<header class="mast"><button class="back" onclick="goBack()" aria-label="返回">‹</button>
    <p>${cls.fullName}　請選擇區組</p><h1>${cls.label}</h1>
    <div class="mast-stat">已選 <b>${sel}</b> / ${tot} 人</div></header><div class="arows">${rows}</div>`;
}

function renderRoster(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const members = getEffectiveMembers(classKey, areaCode);
  const custom = ensureCustom(classKey, areaCode);
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const savedDate = data[`date_${classKey}`] || getDefaultClassDate(classKey);
  const editMode = state.editMode;
  const a = `'${classKey}','${areaCode}'`;
  members.forEach(m => ensurePath(classKey, areaCode, m.name));
  const attendList = members.filter(m => data[classKey][areaCode][m.name].attend);

  let h = `<header class="mast"><button class="back" onclick="goBack()" aria-label="返回">‹</button>
    <p>${cls.fullName}</p><h1>${areaLabel(cls, areaInfo)}</h1></header>
  <div class="tools">
    <label class="date"><span>開班日期</span><input type="date" id="report-date" value="${savedDate}" onchange="onDateChange('${classKey}')"></label>
    <div class="tool-btns">
      <button onclick="selectAll(${a},true)">全選</button>
      <button onclick="selectAll(${a},false)">清除</button>
      <button class="${editMode ? 'is-on' : ''}" onclick="toggleEditMode()">${editMode ? '完成編輯' : '新增／刪除'}</button>
    </div>
  </div>`;
  if (editMode) h += `<p class="note">編輯模式：點選人員即可刪除，或用「＋ 新增人員」加入新成員。</p>`;
  if (!members.length && !editMode) h += `<p class="note" style="color:var(--muted)">此區組尚無人員資料</p>`;

  for (const role of cls.roleOrder) {
    const list = members.filter(m => m.role === role).sort((x, y) => {
      const g = genderRank(x.gender) - genderRank(y.gender);
      return g !== 0 ? g : x.name.localeCompare(y.name, 'zh-Hant');
    });
    if (!list.length) continue;
    const n = list.filter(m => data[classKey][areaCode][m.name].attend).length;
    h += `<section class="sec"><div class="sec-h"><h3>${role}</h3><em>${n} / ${list.length}</em></div><div class="tiles">`;
    for (const m of list) {
      const on = data[classKey][areaCode][m.name].attend;
      const sub = (classKey === 'elder' && areaCode === '2區') ? `<small>${m.area}</small>` : '';
      const act = editMode ? `deleteMember(${a},'${m.name}')` : `toggleAttend(${a},'${m.name}')`;
      h += `<button class="tile${on ? ' on' : ''}${editMode ? ' edit' : ''}" onclick="${act}">${m.name}${sub}</button>`;
    }
    h += `</div></section>`;
  }
  if (editMode) h += `<section class="sec"><div class="tiles"><button class="tile add" onclick="openAddMemberModal(${a})">＋ 新增人員</button></div></section>`;

  h += `<section class="sec"><div class="sec-h"><h3>服務人員</h3><em>多位請用「、」分隔</em></div>
    <div class="svc-row"><input type="text" id="service-name-input-${areaCode}" placeholder="例如：阿黎、阿森" onkeydown="if(event.key==='Enter'){addServicePerson(${a});}"><button onclick="addServicePerson(${a})">新增</button></div>
    <div class="tiles">`;
  if (!custom.service.length) h += `<div class="empty">尚未輸入服務人員</div>`;
  for (const s of custom.service.sort((x, y) => x.name.localeCompare(y.name, 'zh-Hant'))) {
    h += `<div class="tile on svc${editMode ? ' edit' : ''}">${s.name}<button class="x" aria-label="移除${s.name}" onclick="removeServicePerson(${a},'${s.name}')">✕</button></div>`;
  }
  h += `</div></section>`;

  if (!editMode && (attendList.length || custom.service.length)) {
    const open = !!state.bentoListOpen;
    h += `<section class="sec"><button class="bento-h" onclick="toggleBentoListOpen()">
      <span>不要便當人員<small>請在名單上再點選一下</small></span><i>${open ? '收合 ▲' : '展開 ▼'}</i></button>`;
    if (open) {
      h += `<div class="tiles" style="margin-top:10px">`;
      for (const m of attendList) {
        const r = data[classKey][areaCode][m.name];
        h += `<button class="tile${r.noBento ? ' no' : ''}" onclick="toggleBento(${a},'${m.name}')">${m.name}</button>`;
      }
      for (const s of custom.service) {
        h += `<button class="tile${s.noBento ? ' no' : ''}" onclick="toggleServiceBento(${a},'${s.name}')">${s.name}</button>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
  }

  h += `<div class="pad"></div><div class="dock"><div class="dock-in">
    <div class="dock-n"><b>${attendList.length}</b> / ${members.length} 人${custom.service.length ? `　服務 ${custom.service.length} 人` : ''}</div>
    <button class="dock-go" onclick="openReport(${a})">產生 LINE 回報</button></div></div>`;
  return h;
}


function areaLabel(cls, areaInfo) {
  if (!areaInfo) return '';
  if (areaInfo.code === '2區') return '2區';
  return `${areaInfo.code} ${areaInfo.area}區`;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// 各班預設上課日規則：weekday 0=週日...6=週六，n=第幾個
const CLASS_DATE_RULES = {
  child: { weekday: 0, n: 3 }, // 童蒙班：每月第三個禮拜天
  youth: { weekday: 0, n: 4 }, // 青少班：每月第四個禮拜天
  elder: { weekday: 6, n: 1 }, // 學人班：每月第一個禮拜六
};

function nthWeekdayOfMonth(year, month0, weekday, n) {
  const first = new Date(year, month0, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  const day = 1 + offset + (n - 1) * 7;
  return new Date(year, month0, day);
}

function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDefaultClassDate(classKey) {
  const rule = CLASS_DATE_RULES[classKey];
  if (!rule) return todayStr();
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let target = nthWeekdayOfMonth(today.getFullYear(), today.getMonth(), rule.weekday, rule.n);
  if (target < todayMid) {
    target = nthWeekdayOfMonth(today.getFullYear(), today.getMonth() + 1, rule.weekday, rule.n);
  }
  return toDateStr(target);
}

function onDateChange(classKey) {
  const val = document.getElementById('report-date').value;
  data[`date_${classKey}`] = val;
  saveData();
}

function toggleAttend(classKey, areaCode, name) {
  const rec = ensurePath(classKey, areaCode, name);
  rec.attend = !rec.attend;
  if (!rec.attend) rec.noBento = false;
  saveData();
  render();
}

function toggleBento(classKey, areaCode, name) {
  const rec = ensurePath(classKey, areaCode, name);
  if (!rec.attend) return;
  rec.noBento = !rec.noBento;
  saveData();
  render();
}

function selectAll(classKey, areaCode, value) {
  const members = getEffectiveMembers(classKey, areaCode);
  for (const m of members) {
    const rec = ensurePath(classKey, areaCode, m.name);
    rec.attend = value;
    if (!value) rec.noBento = false;
  }
  saveData();
  render();
}

// ══════════════════════════════════════════
// LINE 回報
// ══════════════════════════════════════════
function formatDateForReport(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function genderRank(g) {
  if (g === '乾道') return 0;
  if (g === '坤道') return 1;
  return 2;
}

function chunkNamesToLines(names, perLine) {
  const lines = [];
  for (let i = 0; i < names.length; i += perLine) {
    lines.push(names.slice(i, i + perLine).join('、'));
  }
  return lines;
}

function buildReportText(classKey, areaCode) {
  const cls = CLASSES[classKey];
  const areaInfo = cls.areaOrder.find(a => a.code === areaCode);
  const members = getEffectiveMembers(classKey, areaCode);
  const custom = ensureCustom(classKey, areaCode);
  const dateStr = data[`date_${classKey}`] || getDefaultClassDate(classKey);

  const attendNames = [];
  const noBentoNames = [];
  for (const role of cls.roleOrder) {
    const roleMembers = members.filter(m => m.role === role)
      .sort((a, b) => {
        const g = genderRank(a.gender) - genderRank(b.gender);
        if (g !== 0) return g;
        return a.name.localeCompare(b.name, 'zh-Hant');
      });
    for (const m of roleMembers) {
      const rec = data[classKey] && data[classKey][areaCode] && data[classKey][areaCode][m.name];
      if (rec && rec.attend) {
        attendNames.push(m.name);
        if (rec.noBento) noBentoNames.push(m.name);
      }
    }
  }

  let text = `${formatDateForReport(dateStr)}\n${cls.fullName}\n${areaLabel(cls, areaInfo)}\n參加人員名單如下：\n`;
  text += attendNames.length ? chunkNamesToLines(attendNames, 3).join('\n') : '（尚未選取人員）';

  if (custom.service.length) {
    const serviceSorted = custom.service.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    const serviceNames = serviceSorted.map(s => s.name);
    for (const s of serviceSorted) {
      if (s.noBento) noBentoNames.push(s.name);
    }
    text += `\n\n服務人員：\n${chunkNamesToLines(serviceNames, 3).join('\n')}`;
  }

  if (noBentoNames.length) {
    text += `\n\n不要便當：\n${chunkNamesToLines(noBentoNames, 3).join('\n')}`;
  }

  return text;
}

function openReport(classKey, areaCode) {
  const text = buildReportText(classKey, areaCode);
  const preview = document.getElementById('modal-preview');
  preview.value = text;
  preview.rows = Math.min(16, text.split('\n').length + 1);
  document.getElementById('btn-open-line').href = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function copyReport() {
  const preview = document.getElementById('modal-preview');
  preview.select();
  preview.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(preview.value).then(showCopiedToast, () => {
      document.execCommand('copy');
      showCopiedToast();
    });
  } catch(e) {
    document.execCommand('copy');
    showCopiedToast();
  }
}

function showCopiedToast() {
  const t = document.getElementById('toast');
  t.textContent = '已複製到剪貼簿';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('add-member-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'add-member-overlay') closeAddMemberModal();
});

// ══════════════════════════════════════════
// 初始
// ══════════════════════════════════════════
render();
</script>
<script>
(function(){
  function showTip(msg, color){
    var tip = document.createElement('div');
    tip.textContent = msg;
    tip.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:' + (color||'#1565c0') + ';color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999999;box-shadow:0 2px 12px rgba(0,0,0,.3);font-family:"Noto Sans TC",sans-serif;max-width:90vw;text-align:center;';
    document.body.appendChild(tip);
    return tip;
  }
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('autobackup') === '1') {
      window.addEventListener('load', function(){
        setTimeout(function(){
          try {
            window.exportRosterData();
            showTip('已自動完成備份下載，這個分頁會自動關閉');
            setTimeout(function(){ try { window.close(); } catch(e) {} }, 2200);
          } catch(err) {
            alert('自動備份失敗，請手動點擊頁面上的「各班人員名單匯出」按鈕。\n' + (err && err.message ? err.message : err));
          }
        }, 1200);
      });
    }
    if (qs.get('autorestore') === '1') {
      window.addEventListener('load', function(){
        setTimeout(function(){
          try {
            showTip('請選擇備份檔進行恢復，完成後可自行關閉此分頁', '#0f6e3a');
            window.triggerImportRoster();
          } catch(err) {
            alert('自動開啟恢復失敗，請手動點擊頁面上的「各班人員名單匯入」按鈕。\n' + (err && err.message ? err.message : err));
          }
        }, 1200);
      });
    }
  } catch(e) {}
})();
</script>
